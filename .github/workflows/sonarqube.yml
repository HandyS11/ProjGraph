name: SonarQube Analysis

permissions:
  contents: read

on:
  push:
    branches:
      - develop
  # Allow analysing an arbitrary branch on demand (e.g. a PR branch), so the quality gate
  # can be checked before merging into develop rather than only after.
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # No setup-java: the scanner provisions the JRE its server requires (Java 21 today) and
      # ignores a runner JDK unless told otherwise, so a JDK step would only be downloaded and unused.
      # That JRE, the scanner engine and the analyzer plugins all land in the scanner's user cache.
      # The key follows the scanner version pinned in .config/dotnet-tools.json (bumped by
      # Dependabot), so every scanner update starts a fresh cache. There are no restore-keys on
      # purpose: a prefix match would carry stale plugin versions forward forever.
      - name: Cache SonarQube JRE and plugins
        uses: actions/cache@v6
        with:
          path: ~\.sonar\cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('.config/dotnet-tools.json') }}

      - name: Restore SonarQube scanner
        run: dotnet tool restore
      - name: Build and analyze
        shell: powershell
        run: |
          dotnet sonarscanner begin /k:"${{ secrets.SONAR_PROJECT_KEY }}" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" /d:sonar.exclusions="samples/**/*" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" /d:sonar.coverage.exclusions="samples/**/*,tests/ProjGraph.Tests.Shared/**/*,src/ProjGraph.Cli/Program.cs,src/ProjGraph.Mcp/Program.cs"
          dotnet build ProjGraph.slnx
          dotnet test ProjGraph.slnx --no-build --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
