name: Publish

on:
  push:
    tags:
      - 'v*'
  # Allow re-running a release on demand (e.g. after a transient NuGet/MCP Registry failure).
  # The tag must already exist: every step below derives the version from it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v1.0.3)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write # Required for MCP Registry OIDC authentication

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a valid release tag (expected e.g. v1.0.3 or v1.0.0-rc.1)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract version from tag
        id: get_version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "Tag: $TAG / Version: ${TAG#v}"

      - name: Update Directory.Build.props version
        run: |
          sed -i "s/<Version>.*<\/Version>/<Version>${{ steps.get_version.outputs.version }}<\/Version>/" Directory.Build.props
          echo "Updated Directory.Build.props:"
          grep "<Version>" Directory.Build.props

      - name: Update server.json version
        run: |
          sed -i "s/\"version\": \"[^\"]\+\"/\"version\": \"${{ steps.get_version.outputs.version }}\"/g" src/ProjGraph.Mcp/.mcp/server.json
          echo "Updated server.json:"
          grep "\"version\"" src/ProjGraph.Mcp/.mcp/server.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore dependencies
        run: dotnet restore ProjGraph.slnx

      - name: Build
        run: dotnet build ProjGraph.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ProjGraph.slnx --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack ProjGraph.slnx --configuration Release --output ./artifacts

      - name: Publish to NuGet.org
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push ./artifacts/*.nupkg --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: ${{ steps.get_version.outputs.tag }}
          generate_release_notes: true
          draft: false
          # Treat a tag with a pre-release suffix (e.g. v1.0.0-rc.1) as a pre-release.
          prerelease: ${{ contains(steps.get_version.outputs.tag, '-') }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar -xzf -

      - name: Wait for NuGet.org validation
        run: sleep 300

      - name: Publish to MCP Registry
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 5
          retry_wait_seconds: 120
          command: |
            ./mcp-publisher login github-oidc
            ./mcp-publisher publish src/ProjGraph.Mcp/.mcp/server.json
